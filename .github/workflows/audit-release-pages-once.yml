name: One-time full new-guide browser audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-release-pages-once.yml'
      - 'scripts/audit-release-pages-once.mjs'
      - 'scripts/audit-internal-links-once.py'
permissions:
  contents: read
jobs:
  mobile:
    if: github.repository == 'itsmeb-lab/wilke-public-labs' && github.head_ref == 'atlas/audit-all-new-mobile-pages' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Measure mobile quality for the exact new canonical pages
        shell: bash
        env:
          ATLAS_BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          output="$(mktemp -d "$RUNNER_TEMP/atlas-lighthouse-set.XXXXXXXX")"
          export CHROME_PATH="$(command -v google-chrome)"
          "$CHROME_PATH" --version
          node scripts/audit-release-pages-once.mjs list "$ATLAS_BATCH" > "$output/urls.txt"
          while IFS= read -r url; do
            slug="${url%/}"
            slug="${slug##*/}"
            npx --yes lighthouse@13.6.0 "$url" --only-categories=performance,accessibility,seo --form-factor=mobile --chrome-flags='--headless --no-sandbox' --output=json --output-path="$output/$slug.json" --quiet
          done < "$output/urls.txt"
          node scripts/audit-release-pages-once.mjs collect "$ATLAS_BATCH" "$output"
  links:
    if: github.repository == 'itsmeb-lab/wilke-public-labs' && github.head_ref == 'atlas/audit-all-new-mobile-pages'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify same-site content links against the deployed tree
        run: python3 scripts/audit-internal-links-once.py
