name: Public Labs Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run browser-model tests
        shell: pwsh
        run: npm test
      - name: Run Windows watchdog fixture
        shell: pwsh
        run: .\windows-process-recovery-watchdog\powershell\Test-ProcessWatchdog.ps1
