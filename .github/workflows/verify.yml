name: Public Labs Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run browser-model tests
        shell: pwsh
        run: npm test
      - name: Check actual browser layouts and no-script content
        shell: pwsh
        run: node scripts/browser-policy-check.mjs
      - name: Run Windows watchdog fixture
        shell: pwsh
        run: .\windows-process-recovery-watchdog\powershell\Test-ProcessWatchdog.ps1
      - name: Verify public files and PHP draft exchange
        if: github.event_name == 'pull_request' && github.head_ref == 'atlas/final-public-release-check'
        shell: pwsh
        run: |
          node scripts/review-comparisons.mjs --served
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          php tests/verify-wordpress-csv.php
