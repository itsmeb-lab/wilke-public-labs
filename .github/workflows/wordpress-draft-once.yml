name: Isolated WordPress Draft Verification

on:
  push:
    branches: [atlas/wordpress-draft-zip-verification-20261126]

permissions:
  contents: read

jobs:
  import-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the PHP CSV reader and WordPress file
        run: |
          set -euo pipefail
          php tests/verify-wordpress-csv.php
          node --test tests/wordpress-draft-export.test.mjs
          node scripts/export-wordpress-draft.mjs --slug home-energy-tool-lending --output "$RUNNER_TEMP/energy-draft.xml"
      - name: Install WordPress into a disposable local database
        env:
          WP_CORE_VERSION: '7.1.5'
          WP_CORE_SHA1: 'd7d004a092a4e8f2b28dc8f4089a11fea9a38807'
        run: |
          set -euo pipefail
          wp_root="$RUNNER_TEMP/wp-test"
          wp_cli="$RUNNER_TEMP/wp-cli.phar"
          curl --proto '=https' --fail --silent --show-error --max-time 40 \
            'https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar' -o "$wp_cli"
          php "$wp_cli" --version
          sudo systemctl start mysql.service
          MYSQL_PWD=root mysql -uroot -e 'CREATE DATABASE atlas_verify'
          wp_site() { php "$wp_cli" --path="$wp_root" "$@"; }
          # WP-CLI's tar extractor truncates some long WordPress core filenames.
          wp_zip="$RUNNER_TEMP/wordpress-$WP_CORE_VERSION.zip"
          curl --proto '=https' --proto-redir '=https' --location --fail --silent --show-error --max-time 60 \
            "https://wordpress.org/wordpress-$WP_CORE_VERSION.zip" -o "$wp_zip"
          printf '%s  %s\n' "$WP_CORE_SHA1" "$wp_zip" | sha1sum --check --status
          extract_root="$(mktemp -d "$RUNNER_TEMP/wp-extract.XXXXXXXX")"
          unzip -q "$wp_zip" -d "$extract_root"
          test -f "$extract_root/wordpress/wp-load.php"
          mv -T "$extract_root/wordpress" "$wp_root"
          wp_site core verify-checksums --version="$WP_CORE_VERSION" --locale=en_US
          wp_site config create --dbname=atlas_verify --dbuser=root --dbpass=root --dbhost=localhost
          wp_site core install --url='http://atlas-wp-test.invalid' --title='Atlas Draft Test' \
            --admin_user=atlas_test --admin_password='Disposable-Fixture-Only-541!' \
            --admin_email=atlas-test@example.invalid --skip-email
          wp_site plugin install wordpress-importer --version=0.9.7 --activate
          wp_site plugin verify-checksums wordpress-importer
          wp_site core version
          wp_site plugin get wordpress-importer --field=version
          wp_site theme list --status=active --fields=name,version
          php --version | head -1
      - name: Verify import and replay retain one nonpublic draft page
        run: |
          set -euo pipefail
          wp_root="$RUNNER_TEMP/wp-test"
          wp_cli="$RUNNER_TEMP/wp-cli.phar"
          wp_site() { php "$wp_cli" --path="$wp_root" --user=atlas_test "$@"; }
          wp_site import "$RUNNER_TEMP/energy-draft.xml" --authors=skip --skip=attachment
          wp_site eval 'require getenv("GITHUB_WORKSPACE") . "/tests/verify-wordpress-import.php";'
          wp_site import "$RUNNER_TEMP/energy-draft.xml" --authors=skip --skip=attachment
          wp_site eval 'require getenv("GITHUB_WORKSPACE") . "/tests/verify-wordpress-import.php";'
  public-exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch live guide, data, and navigation
        run: node scripts/check-energy-release-once.mjs

